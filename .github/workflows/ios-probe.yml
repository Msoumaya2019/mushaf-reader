name: IPA iPhone non signé
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Générer le projet natif iOS
        run: node node_modules/expo/bin/cli prebuild --platform ios --no-install
      - name: Vérifier la capacité de notification iOS
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'aps-environment' ios --include='*.entitlements'
      - name: Installer les dépendances iOS
        run: pod install --project-directory=ios
      - name: Compiler sans signature
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/coran-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Créer l’IPA à signer avec eSign
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/coran-build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p unsigned/Payload
          ditto "$APP" "unsigned/Payload/$(basename "$APP")"
          (cd unsigned && zip -qry ../coran-memoire-unsigned.ipa Payload)
          unzip -t coran-memoire-unsigned.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: coran-memoire-unsigned-ipa
          path: coran-memoire-unsigned.ipa
          if-no-files-found: error
